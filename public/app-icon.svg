<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Musterd</title>
  <desc id="desc">Three ascending ink bars on a black rounded tile — the Musterd mark.</desc>
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224" /></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#070707" />
    <!-- Bars scaled from the 24×24 chrome mark (viewBox), ink-only, no mustard. -->
    <g fill="#F2F0EA" transform="translate(128 128) scale(32)">
      <rect x="3" y="11" width="4.5" height="10" rx="1" />
      <rect x="9.75" y="7" width="4.5" height="14" rx="1" />
      <rect x="16.5" y="3" width="4.5" height="18" rx="1" />
    </g>
  </g>
</svg>
